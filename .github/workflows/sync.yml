name: Auto Merge Upstream Generic

on:
  schedule:
    - cron: '0 */6 * * *' 
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码，并使用你刚才配置的最高权限令牌
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          token: ${{ secrets.SYNC_TOKEN }}

      # 2. 配置 Git 身份
      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      # 3. 动态获取并合并，授权 GitHub CLI 使用新令牌
      - name: Merge Upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          UPSTREAM_REPO=$(gh repo view $GITHUB_REPOSITORY --json parent --jq '.parent.owner.login + "/" + .parent.name')
          echo "找到原作者仓库: $UPSTREAM_REPO"
          
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream
          
          UPSTREAM_BRANCH=$(gh repo view $UPSTREAM_REPO --json defaultBranchRef --jq '.defaultBranchRef.name')
          echo "原作者默认分支为: $UPSTREAM_BRANCH"
          
          CURRENT_BRANCH=$(git branch --show-current)
          
          # 执行合并并推送
          git merge "upstream/$UPSTREAM_BRANCH" --no-edit
          git push origin "$CURRENT_BRANCH"
