name: Auto Merge Upstream

on:
  schedule:
    # 依然是每 6 小时执行一次
    - cron: '0 */6 * * *' 
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. 检出你自己的仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须提取完整历史记录，这是自动合并比对的前提

      # 2. 配置 GitHub 机器人的 Git 基础身份
      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      # 3. 拉取上游代码并进行智能合并
      - name: Merge Upstream
        run: |
          # 指定原作者的仓库地址作为上游
          git remote add upstream https://github.com/ZhuLinsen/daily_stock_analysis.git
          git fetch upstream
          
          # 自动合并原作者的 main 分支到你的仓库，--no-edit 表示全自动不弹窗
          git merge upstream/main --no-edit
          
          # 将合并后的最新代码推送到你的仓库
          git push origin main
